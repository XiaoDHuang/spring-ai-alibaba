  <rect x="60" y="92" width="1180" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text class="band" fill="#1d4ed8" x="80" y="118">前端 · React 18 + Ant Design 5 · umi 4 · 多包 monorepo</text>
  <g>
    <rect x="80" y="130" width="270" height="100" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.4"/>
    <text class="ct" fill="#1e40af" x="96" y="154">Prompt / Agent Studio（main）</text>
    <text class="cd" x="96" y="174">Prompt 模板/版本/调试、低代码搭建、</text>
    <text class="cd" x="96" y="190">知识库、模型与 MCP 管理。</text>
    <text class="ev" x="96" y="216">packages/main · react-router 6 · axios</text>
  </g>
  <g>
    <rect x="365" y="130" width="270" height="100" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.4"/>
