    <text class="cd" x="96" y="392">Observability ｜ App · Workflow · KnowledgeBase · McpServer · Tool · Auth/OAuth2</text>
    <text class="ev" x="96" y="418">鉴权拦截器 · 请求/响应 DTO · spring-boot-starter-web</text>
