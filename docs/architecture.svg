  <line x1="935" y1="434" x2="935" y2="468" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- row2: core -->
  <g>
    <rect x="80" y="470" width="1140" height="118" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.4"/>
    <text class="ct" fill="#166534" x="96" y="494">server-core　·　业务核心</text>
    <text class="cd" x="96" y="516">Service 层：PromptService · DatasetService · EvaluatorService · ExperimentService · TracingService ·</text>
    <text class="cd" x="96" y="532">KnowledgeBase / Document / Tool / McpServer / Workflow / Account。RAG 管道（PDF·Tika·Markdown → ES 向量库）。</text>
    <text class="ev" x="96" y="558">MyBatis-Plus · Druid 连接池 · jgrapht · GraalVM(JS/Python) · Redisson · RocketMQ producer · Argon2 + JWT 鉴权</text>
  </g>
  <line x1="650" y1="588" x2="650" y2="622" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

