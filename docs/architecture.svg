  <text x="60" y="1172" font-size="10.5" fill="#94a3b8">实线箭头=调用/依赖（标注协议）；蓝色虚线=外部 Agent 数据流；右侧虚线框为横切设施。所有端口/表名/依赖均取自 docker-compose · *.sql · pom.xml。</text>
