    <text class="cd" x="381" y="174">工作流可视化编排、节点拖拽连线，</text>
    <text class="cd" x="381" y="190">实验运行与结果对比视图。</text>
    <text class="ev" x="381" y="216">packages/spark-flow · @dnd-kit</text>
  </g>
  <g>
    <rect x="650" y="130" width="270" height="100" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.4"/>
    <text class="ct" fill="#1e40af" x="666" y="154">评测 / 可观测 UI</text>
    <text class="cd" x="666" y="174">数据集、评估器、实验大盘，</text>
    <text class="cd" x="666" y="190">Trace / Span 链路查看。</text>
    <text class="ev" x="666" y="216">Observability · 服务总览</text>
  </g>
  <g>
    <rect x="935" y="130" width="285" height="100" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.4"/>
    <text class="ct" fill="#1e40af" x="951" y="154">spark-i18n</text>
    <text class="cd" x="951" y="174">多语言资源包，被 main 与</text>
    <text class="cd" x="951" y="190">spark-flow 共享复用。</text>
    <text class="ev" x="951" y="216">packages/spark-i18n</text>
  </g>

