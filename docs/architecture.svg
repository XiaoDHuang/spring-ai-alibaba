    <text class="cd" x="666" y="376">Spring Boot 入口 · OTel 自动配置 · Nacos 配置 ·</text>
    <text class="cd" x="666" y="392">模型动态切换（OpenAI / DashScope / DeepSeek / Ollama）。</text>
    <text class="ev" x="666" y="418">model-config.yaml · micrometer-registry-otlp</text>
  </g>
