<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1180" viewBox="0 0 1640 1180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#94a3b8"/></marker>
    <marker id="arrd" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0891b2"/></marker>
    <style>
      .lane{font-size:14px;font-weight:800;letter-spacing:2px;}
      .band{font-size:15px;font-weight:800;}
      .ct{font-size:13.5px;font-weight:700;}
      .cd{font-size:10.5px;fill:#475569;}
      .ev{font-size:9.5px;fill:#94a3b8;font-style:italic;}
