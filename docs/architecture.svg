  </defs>
  <rect width="1640" height="1180" fill="#f8fafc"/>

  <text x="60" y="46" font-size="26" font-weight="800" fill="#0f172a">Spring AI Alibaba Admin — System Architecture</text>
  <text x="60" y="70" font-size="13" fill="#64748b">Agent Studio · AI Agent 全生命周期平台（基于源码核对：pom / docker-compose / *.sql / Controller）</text>

  <!-- ===================== FRONTEND ===================== -->
