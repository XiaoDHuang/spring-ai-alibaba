  <!-- row1: openapi + start -->
  <g>
    <rect x="80" y="330" width="555" height="104" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.4"/>
    <text class="ct" fill="#166534" x="96" y="354">server-openapi　·　REST 接入层</text>
